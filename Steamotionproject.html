<style>
:root{color-scheme:dark;--bg:#191970;--bg2:#0d0d3a;--p:rgba(6,8,40,.6);--p2:rgba(255,255,255,.08);--t:#fff;--m:#a9b4d6;--g:#a4d007;--gd:#4c6b22;--b:#4aa3ff;--r:#ff7b7b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
html,body{margin:0}
body{background:linear-gradient(var(--bg),var(--bg2)) fixed;color:var(--t);font:14px/1.35 "Segoe UI",system-ui,sans-serif;min-height:100vh;max-width:560px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:8px 12px 10px;border-bottom:1px solid #000}
.r1{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
.logo{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6cc4ff,#1b4fb8);display:grid;place-items:center;font-size:14px}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;color:var(--m);font:inherit;font-size:13px;padding:6px 8px;border-radius:6px}
.nav button.on{color:#fff;background:var(--p2)}
.srch{position:relative;margin-top:8px}
.srch input{width:100%;background:#343434;border:1px solid #343434;border-radius:6px;color:#fff;font:inherit;padding:8px 10px}
.srch input::placeholder{color:#8a8a8a}
#dd{display:none;position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#12124d;border:1px solid #2a2a8a;border-radius:8px;padding:8px;max-height:60vh;overflow:auto;box-shadow:0 8px 24px #000a}
#dd h6{margin:2px 4px 8px;font-size:12px;font-weight:400;color:var(--m)}
main{padding:12px}
h2{margin:4px 0 10px;font-size:18px}
.card{display:grid;grid-template-columns:104px 1fr;gap:10px;background:var(--p);border-radius:8px;padding:6px;margin-bottom:8px;cursor:pointer}
.cap{display:grid;place-items:center;text-align:center;border-radius:6px;padding:6px;font-size:12px;overflow:hidden;word-break:break-word}
.inf{display:flex;flex-direction:column;gap:2px;min-width:0}
.inf b{font-size:14px}
small{color:var(--m);font-size:11.5px}
.pt{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:auto}
.ds{background:var(--g);color:#1b2a00;font-weight:700;padding:2px 5px;border-radius:3px}
.old{color:#7b8aa8;text-decoration:line-through;font-size:12px}
.np{font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.btn{background:linear-gradient(#5ec23a,#2f8a1f);border:0;color:#fff;font:inherit;font-weight:600;padding:9px 14px;border-radius:6px;cursor:pointer}
.btn.s{background:var(--p2);font-weight:400}
.btn.d{background:#7a2a2a}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.chips span{background:#2a4a7a;color:#9fd0ff;font-size:12px;padding:2px 7px;border-radius:3px}
.panel{background:var(--p);border-radius:8px;padding:12px;margin:10px 0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;font-size:13px}
.kv span:nth-child(odd){color:var(--m)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sum div{background:var(--p);border-radius:8px;padding:8px;text-align:center}
.sum small{display:block}.sum b{font-size:16px}
.lib{display:grid;grid-template-columns:108px 1fr;gap:8px;margin-top:10px}
.side{background:var(--p);border-radius:8px;padding:4px;max-height:70vh;overflow:auto}
.si{display:flex;gap:6px;align-items:center;padding:6px;border-radius:5px;font-size:12px;cursor:pointer;color:var(--m)}
.si.on{background:#3b4a8a;color:#fff}
.si i{flex:none;width:16px;height:16px;border-radius:3px}
.pill{display:inline-block;background:var(--p2);padding:4px 9px;border-radius:5px;margin:0 6px 6px 0;font-size:13px}
.pill.g{background:var(--gd);color:#dff59a}
.form{display:grid;gap:8px;margin-top:8px}
.form input{background:#12124d;border:1px solid #2a2a8a;border-radius:6px;color:#fff;font:inherit;padding:8px}
.av{width:96px;height:96px;border-radius:50%;background:#2a2a8a;display:grid;place-items:center;font-size:44px;margin:18px auto 10px}
.c{text-align:center}
.z{display:flex;gap:6px;margin-bottom:8px}
.z button{background:#12124d;border:1px solid #2a4a8a;color:var(--b);border-radius:5px;padding:4px 10px;font:inherit}
.z button.on{background:#3b4a8a;color:#fff}
svg{width:100%;height:auto;display:block}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.st div{background:var(--p2);border-radius:6px;padding:8px}
.st b{display:block;font-size:15px}
.back{background:none;border:0;color:var(--b);font:inherit;padding:0 0 6px}
.srch{display:flex;gap:6px}.srch input{flex:1;width:auto;min-width:0}.srch select{background:#343434;color:#fff;border:0;border-radius:6px;padding:0 6px;font:inherit}
.cap svg{position:absolute;inset:0;width:100%;height:100%}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:6px;border-radius:8px}.sl{flex:0 0 100%;scroll-snap-align:start;position:relative;border-radius:8px;overflow:hidden}
.play{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;text-shadow:0 2px 8px #000}.cnt{position:absolute;left:8px;bottom:6px;color:#fff;text-shadow:0 1px 3px #000}
table{width:100%;border-collapse:collapse;margin-top:6px}td{padding:7px 4px;border-top:1px solid #2a2a8a;font-size:13px}tr.on{background:#3b4a8a}tr[data-a]{cursor:pointer}
.tip{background:var(--p2);border-radius:6px;padding:8px;margin-top:8px;font-size:13px}input[type=range]{margin-top:8px}
</style>
</head>

const TR=h=>LANG==='uk'?h:D.reduce((s,[u,e,n])=>s.split(u).join(LANG==='nb'&&n?n:e),h);

const curT=g=>{const lo=Math.min(...hist(g)),v=pa(g,st.off);return `<div class="panel"><b>Ціна у валютах</b><small style="display:block;margin:4px 0">Торкніться валюти, щоб обрати її. Курси орієнтовні.</small><table>${['UAH','NOK','USD'].map(c=>`<tr data-a="cur" data-c="${c}" class="${st.cur===c?'on':''}"><td>${{UAH:'Гривня',NOK:'Норвезька крона',USD:'Долар США'}[c]}</td><td>${fc(v,c)}</td><td>${fc(lo,c)}</td></tr>`).join('')}</table><small>Колонки: на вибрану дату · мінімум за 2 роки</small></div>`};
const dateCtl=()=>`<div class="panel row"><small>Ціни на дату</small><input type="date" id="dt" value="${dstr(st.off)}" min="${dstr(729)}" max="${dstr(0)}" style="flex:1;background:#12124d;border:1px solid #2a2a8a;border-radius:6px;color:#fff;font:inherit;padding:6px"><button class="btn s" data-a="today">Сьогодні</button></div>`;
let st={v:'store',gid:null,sel:0,z:730,add:false,off:0,cur:S('se_cur','UAH')},lib=S('se_lib',[]),user=S('se_user',null);
const pr=g=>Math.round(g.p*(100-g.s)/100);
const RT={UAH:1,NOK:1/4.1,USD:1/41.5},SY={UAH:'₴',NOK:'kr',USD:'$'};
const fc=(n,c)=>n===0?'Безкоштовно':(n*RT[c]).toLocaleString(({uk:'uk-UA',en:'en-US',nb:'nb-NO'})[LANG]||'en-US',{minimumFractionDigits:c==='UAH'?0:2,maximumFractionDigits:c==='UAH'?0:2})+' '+SY[c];
const F=n=>fc(n,st.cur);
const cap=(g,h)=>`<div class="cap" style="height:${h}px;padding:0;position:relative">${art(g,0,h)}<b style="position:relative;padding:6px;text-shadow:0 1px 4px #000">${E(g.n)}</b></div>`;
const pt=(g,v=pr(g))=>{const s=g.p?Math.round((1-v/g.p)*100):0;return s>0?`<span class="ds">−${s}%</span><span class="old">${F(g.p)}</span><span class="np">${F(v)}</span>`:`<span class="np">${F(v)}</span>`};
const card=g=>`<div class="card" data-a="game" data-id="${g.id}">${cap(g,70)}<div class="inf"><b>${E(g.n)}</b><small>${g.t.join(', ')}</small><small>Дата випуску: ${g.d}</small><div class="pt">${pt(g,pa(g,st.off))}</div></div></div>`;
const mk=s=>()=>(s=s*16807%2147483647)/2147483647;
function hist(g){if(HC[g.id])return HC[g.id];const r=mk(g.id*7919),a=[];let d=0;
 while(d<730){const sale=r()<.35,v=sale?Math.round(g.p*(1-[.1,.2,.35,.5][r()*4|0])):g.p,n=sale?4+(r()*10|0):10+(r()*40|0);
  for(let i=0;i<n&&d<730;i++,d++)a.push(v)}
 for(let i=0;i<7;i++)a[729-i]=pr(g);return HC[g.id]=a}
function chart(g){
 const a=hist(g),lo=Math.min(...a),s=a.slice(-st.z),mx=Math.max(...s,1),Wd=360,H=150,x=i=>i*Wd/(s.length-1),y=v=>H-v/(mx*1.1)*H;
 let d=`M0 ${y(s[0]).toFixed(1)}`;
 for(let i=1;i<s.length;i++)if(s[i]!==s[i-1])d+=`L${x(i).toFixed(1)} ${y(s[i-1]).toFixed(1)}L${x(i).toFixed(1)} ${y(s[i]).toFixed(1)}`;
 d+=`L${Wd} ${y(s[s.length-1]).toFixed(1)}`;
 const avg=s.reduce((q,v)=>q+v,0)/s.length,cur=pr(g);CH={s,g};
 return `<div class="panel"><h2 style="margin-top:0">Історія цін (UA)</h2>
 <div class="z">${[[183,'6м'],[365,'1р'],[730,'2р']].map(([z,l])=>`<button data-a="zoom" data-z="${z}" class="${st.z===z?'on':''}">${l}</button>`).join('')}</div>
 <svg viewBox="0 0 360 160"><path d="${d}L${Wd} ${H}L0 ${H}Z" fill="rgba(164,208,7,.12)"/><path d="${d}" fill="none" stroke="#a4d007" stroke-width="2"/>
 <line x1="0" x2="${Wd}" y1="${y(lo)}" y2="${y(lo)}" stroke="#4aa3ff" stroke-dasharray="4 3"/>
 <text x="2" y="12" fill="#a9b4d6" font-size="10">${F(mx)}</text><line id="mk" x1="${Wd}" x2="${Wd}" y1="0" y2="150" stroke="#fff" stroke-width="1.5"/></svg><input type="range" id="sc" aria-label="Дата" min="0" max="${s.length-1}" value="${s.length-1}" style="width:100%"><div id="tip" class="tip">${tipH(s.length-1)}</div>
 <small>Зелена лінія — ціна, синя пунктирна — мінімум за 2 роки</small>
 <div class="st"><div><small>Зараз</small><b>${F(cur)}</b></div><div><small>Мінімум (2 роки)</small><b>${F(lo)}</b></div>
 <div><small>Максимум</small><b>${F(Math.max(...a))}</b></div><div><small>Середня за період</small><b>${F(avg)}</b></div></div>
 ${g.p&&cur<=lo?'<p style="color:var(--g)">Зараз — історичний мінімум ціни.</p>':''}</div>`}
function vStore(){return `<h2>Знижки та новинки</h2>${dateCtl()}${G.map(card).join('')}<small>Демо-дані з вашого макета. Історія цін змодельована.</small>`}

 return `<button class="back" data-a="nav" data-v="store">← Усі ігри</button><h2>${E(g.n)}</h2>${gal(g)}

 ${dateCtl()}<div class="panel"><div class="pt" style="justify-content:flex-start;font-size:18px">${pt(g,pa(g,st.off))}</div>

 <input id="gp" type="number" min="0" value="${+(pa(g,st.off)*RT[st.cur]).toFixed(2)}" aria-label="Ціна покупки">

 ${specs(g)}${g.rq?`<div class="panel"><b>Системні вимоги</b><div class="chips" style="display:block">${g.rq.map(r=>`<small style="display:block">${r}</small>`).join('')}</div></div>`:''}
 ${chart(g)}${curT(g)}`}
function vLib(){
 const sp=lib.reduce((a,x)=>a+x.paid,0),sv=lib.reduce((a,x)=>a+Math.max(0,x.base-x.paid),0);
 let h=`<div class="sum"><div><small>Витрачено</small><b>${F(sp)}</b></div><div><small>Ігор</small><b>${lib.length}</b></div><div><small>Заощаджено</small><b>${F(sv)}</b></div></div>
 <button class="btn s" data-a="addf">+ Додати гру вручну</button>`;
 if(st.add)h+=`<div class="panel form"><input id="fn" placeholder="Назва гри"><input id="fb" type="number" min="0" placeholder="Ціна в магазині без знижки"><input id="fp" type="number" min="0" placeholder="Скільки заплатили (у вибраній валюті)"><input id="fd" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="btn" data-a="save">Зберегти</button></div>`;
 if(!lib.length)return h+`<div class="panel c"><p>Тут поки порожньо.</p><small>Відкрийте гру в крамниці й додайте її в бібліотеку або внесіть вручну.</small></div>`;
 const i=Math.min(st.sel,lib.length-1),x=lib[i],pc=x.base?Math.round((1-x.paid/x.base)*100):0;

 <div>${cap({n:x.n,c:x.c},110)}<div style="margin-top:8px"><span class="pill">${F(x.paid)}</span><span class="pill ${pc>0?'g':''}">${pc>0?`зі знижкою −${pc}%`:'без знижки'}</span><span class="pill">${E(x.date||'—')}</span>
 <div class="kv panel"><span>В магазині</span><span>${F(x.base)}</span><span>Заощаджено</span><span>${F(Math.max(0,x.base-x.paid))}</span></div>
 <button class="btn d" data-a="del">Видалити</button></div></div></div>`}
function vAcc(){
 if(!user)return `<div class="c"><div class="av">?</div><h2>Видно, тут нічого немає</h2><p><small>Увійдіть в акаунт, щоб бачити свою статистику.</small></p>

 <button class="btn s" data-a="logout">Вийти</button><p><small>Це локальний вхід лише для цього пристрою. Прив’язати справжній акаунт Steam тут поки неможливо: для цього потрібен сервер (вхід через Steam і Steam Web API).</small></p>`}
function R(top=true){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(st.v==='game'?'store':st.v)));

function dd(){
 const q=$('#q').value.trim().toLowerCase(),box=$('#dd');
 const L=q?G.filter(g=>g.n.toLowerCase().includes(q)):POP.map(id=>G.find(g=>g.id===id));

 box.innerHTML=TR((q?'':'<h6>Популярні пошукові запити</h6>')+(L.length?L.map(card).join(''):'<h6>Нічого не знайдено</h6>'))}
document.addEventListener('input',e=>{if(e.target.id==='sc'){const i=+e.target.value,x=i*360/(CH.s.length-1);$('#mk').setAttribute('x1',x);$('#mk').setAttribute('x2',x);$('#tip').innerHTML=TR(tipH(i))}});

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');
 if(!e.target.closest('.srch'))$('#dd').style.display='none';
 if(!t)return;const a=t.dataset.a;
 if(a==='nav'){st.v=t.dataset.v;st.add=false;$('#dd').style.display='none';R()}
 else if(a==='game'){st.v='game';st.gid=+t.dataset.id;st.z=730;$('#dd').style.display='none';$('#q').value='';R()}
 else if(a==='today'){st.off=0;R(false)}
 else if(a==='cur'){st.cur=t.dataset.c;$('#cur').value=st.cur;W('se_cur',st.cur);R(false)}
 else if(a==='lang'){LANG=t.dataset.c;W('se_lang',LANG);R(false)}
 else if(a==='setd'){st.off=+t.dataset.o;R(false);scrollTo(0,0)}
 else if(a==='zoom'){st.z=+t.dataset.z;R(false)}
 else if(a==='sel'){st.sel=+t.dataset.i;R(false)}
 else if(a==='addf'){st.add=!st.add;R(false)}
 else if(a==='addg'){const g=G.find(x=>x.id===st.gid);lib.push({n:g.n,paid:Math.max(0,(+$('#gp').value||0)/RT[st.cur]),base:g.p,date:dstr(st.off),c:g.c});W('se_lib',lib);st.sel=lib.length-1;st.v='lib';R()}
 else if(a==='save'){const n=$('#fn').value.trim();if(!n)return;const b=Math.max(0,(+$('#fb').value||0)/RT[st.cur]),p=Math.max(0,(+$('#fp').value||0)/RT[st.cur]);

 else if(a==='del'){lib.splice(st.sel,1);st.sel=0;W('se_lib',lib);R(false)}
 else if(a==='login'){const n=$('#un').value.trim();if(!n)return;user=n;W('se_user',user);R(false)}

});
